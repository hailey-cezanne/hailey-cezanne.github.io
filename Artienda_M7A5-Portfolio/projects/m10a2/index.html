<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curbside Thai - Find a Dish</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <nav aria-label="Portfolio"><a class="portfolio-return" href="../../index.html#projects">← Back to portfolio</a></nav>
  <main class="card">
    <p class="eyebrow">Curbside Thai</p>
    <h1>Find a Dish</h1>

    <div class="field">
      <label for="search">Search</label>
      <input type="text" id="search" placeholder="try: cur">
    </div>

    <!-- JavaScript fills this in -->
    <ul class="menu" id="menu"></ul>

    <!-- Message only appears when no dishes match -->
    <p class="warning" id="empty"></p>

    <p class="line">Showing <span id="count">0</span></p>

    <p class="footnote">The list narrows as you type.</p>
  </main>
</body>
</html>
